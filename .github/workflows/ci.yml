name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (Git engine, files, GitHub, data, sync engine)
        run: ./gradlew :core:git:test :core:files:test :core:github:test :core:security:testDebugUnitTest :core:data:testDebugUnitTest :sync:testDebugUnitTest --console=plain
      - name: Lint and build debug APKs (Standard and Full)
        run: ./gradlew :app:lintStandardDebug :app:assembleStandardDebug :app:assembleFullDebug --console=plain
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/lint-results-*.*
            **/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: gitpockit-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
